<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Nollan Play</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111722;--line:#263244;--muted:#9aa8bb;--text:#f4f7fb;--lime:#c7ff5e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#0b1019;border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;letter-spacing:-.4px;white-space:nowrap}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--lime);color:#11180a;font-weight:1000}
.brand span:last-child{color:var(--lime)}
nav{display:flex;gap:8px;margin-left:auto}
button{border:1px solid var(--line);background:#141c29;color:#d7e0ed;border-radius:10px;padding:10px 15px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
button[aria-selected="true"]{background:var(--lime);color:#11180a;border-color:var(--lime)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{display:none;flex:1;min-height:0}
.panel.active{display:flex;flex-direction:column}
.panel-label{display:flex;align-items:center;gap:9px;padding:10px 15px;color:var(--muted);font-size:12px;border-bottom:1px solid #ffffff12;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.frame-wrap{position:relative;flex:1;min-height:0;background:#05070b}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#05070b}
@media(max-width:480px){header{padding:10px;gap:8px}.brand{font-size:14px}nav{gap:6px}button{padding:10px 11px;font-size:12px}.logo{width:29px;height:29px}}
</style>
</head>
<body>
<header>
<a class="brand" href="#" aria-label="Nollan Play"><span class="logo">N</span><span>NOLLAN PLAY</span></a>
<nav aria-label="Choose stream">
<button type="button" id="sports-tab" aria-controls="sports-panel" aria-selected="true">⚽ Football</button>
<button type="button" id="movies-tab" aria-controls="movies-panel" aria-selected="false">🎬 Movies</button>
</nav>
</header>
<main>
<section class="panel active" id="sports-panel" aria-label="Embedded football channels">
<div class="panel-label"><span class="dot"></span> Football & sports channels</div>
<div class="frame-wrap"><iframe src="https://dlive.sx/24-7-channels.php" title="Embedded football and sports channels" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
</section>
<section class="panel" id="movies-panel" aria-label="Embedded movie library">
<div class="panel-label"><span class="dot"></span> Movies & TV shows</div>
<div class="frame-wrap"><iframe src="https://www.1shows.org/" title="Embedded movie and TV site" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
</section>
</main>
<script>
const sportsTab=document.getElementById('sports-tab');
const moviesTab=document.getElementById('movies-tab');
const sportsPanel=document.getElementById('sports-panel');
const moviesPanel=document.getElementById('movies-panel');
function selectTab(which){
 const sports=which==='sports';
 sportsTab.setAttribute('aria-selected',String(sports));
 moviesTab.setAttribute('aria-selected',String(!sports));
 sportsPanel.classList.toggle('active',sports);
 moviesPanel.classList.toggle('active',!sports);
 const frame=moviesPanel.querySelector('iframe');
 if(!sports && frame.loading==='lazy') frame.loading='eager';
}
sportsTab.addEventListener('click',()=>selectTab('sports'));
moviesTab.addEventListener('click',()=>selectTab('movies'));
</script>
</body>
</html>
